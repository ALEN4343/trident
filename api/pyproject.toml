[project]
name = "trident"
version = "0.1.0"
description = "Marine pollution intelligence: detect, localise, forecast drift, dispatch cleanup."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "python-multipart>=0.0.12",
    "truststore>=0.10",
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "ultralytics>=8.3",
]
routing = ["ortools>=9.11"]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["trident*"]

[tool.setuptools.package-data]
trident = ["taxonomy/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
